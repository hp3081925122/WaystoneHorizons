side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "shogi"
type = "required"
versionRange = "[26.1.2.12,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"

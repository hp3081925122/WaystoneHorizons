// 当前文件只保留最小的 NeoForge 开发、构建和运行配置。
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

repositories {
    maven {
        url = 'https://maven.twelveiterations.com/repository/maven-public/'
        content { includeGroup 'net.blay09.mods' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = 'neoforge-26.1.2-WaystoneHorizons'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

if (providers.gradleProperty('withGameTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}

def dedicatedServerRun = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() in ['runServer', 'runGameTestServer']
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    implementation 'curse.maven:waystones-245755:8837358'
    implementation 'curse.maven:balm-531761:8969765'
    implementation 'curse.maven:shogi-1475746:8978486'
    compileOnly 'net.blay09.mods:shogi-api:26.1.2.12'
    // 保留模板客户端辅助依赖，专用服务端只保留编译引用。
    ['curse.maven:jei-238222:8771077',
     'curse.maven:just-enough-characters-250702:8413185',
     'curse.maven:jade-324717:8651070',
     'curse.maven:advanced-loot-info-1205426:8169069'].each { coordinate ->
        if (dedicatedServerRun) {
            compileOnly coordinate
        } else {
            implementation coordinate
        }
    }
}

tasks.named('jar', Jar).configure {
    exclude 'com/waystonehorizons/gametest/**'
    exclude 'data/waystonehorizons/structure/gametest/**'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version,
            neo_version_range: project.neo_version_range,
            loader_version_range: project.loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: project.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
